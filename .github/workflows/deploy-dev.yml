name: Deploy (dev)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: lipl-deploy-dev
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --console=plain
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: lipl-frontend
          - context: backend
            image: lipl-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: harbor.kigawa.net/private/${{ matrix.image }}:develop-${{ github.sha }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          repository: kigawa-net/platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: platform

      - name: Update image tags for dev
        working-directory: platform
        run: |
          sed -i "s|image: harbor.kigawa.net/private/lipl-api:.*|image: harbor.kigawa.net/private/lipl-api:develop-${{ github.sha }}|" lipl/dev/lipl-api.yaml
          sed -i "s|image: harbor.kigawa.net/private/lipl-frontend:.*|image: harbor.kigawa.net/private/lipl-frontend:develop-${{ github.sha }}|" lipl/dev/lipl-frontend.yaml

      - name: Commit and push
        working-directory: platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lipl/dev/lipl-api.yaml lipl/dev/lipl-frontend.yaml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "deploy: lipl dev ${{ github.sha }}"
          git push
