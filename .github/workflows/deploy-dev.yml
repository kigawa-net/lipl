name: Deploy (dev)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: lipl-deploy-dev
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --console=plain
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: lipl-frontend
          - context: backend
            image: lipl-api
    steps:
      - uses: actions/checkout@v7

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            929d361e-e599-4b58-b173-b3e201004d0a > HARBOR_USERNAME
            13c66d3b-7eb6-4c37-b466-b3e2010057b1 > HARBOR_PASSWORD

      - uses: docker/login-action@v4
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: harbor.kigawa.net/private/${{ matrix.image }}:develop-${{ github.sha }}

# platformリポジトリへのマニフェスト更新は不要。
# ArgoCD ApplicationSet（platform: apps/lipl-dev-appset.yml）のPull Request Generatorが
# PRごとにnamespace/imageタグ（develop-<head_sha>）を動的に解決してデプロイする。
