name: Deploy (stg)

on:
  push:
    branches: [main]

concurrency:
  group: lipl-deploy-stg
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --console=plain
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: lipl-frontend
          - context: backend
            image: lipl-api
    steps:
      - uses: actions/checkout@v4

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            <harbor-username-secret-id> > HARBOR_USERNAME
            <harbor-password-secret-id> > HARBOR_PASSWORD

      - uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: harbor.kigawa.net/private/${{ matrix.image }}:main-${{ github.sha }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            <platform-repo-token-secret-id> > PLATFORM_REPO_TOKEN

      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          repository: kigawa-net/platform
          token: ${{ env.PLATFORM_REPO_TOKEN }}
          path: platform

      - name: Update image tags for stg
        working-directory: platform
        run: |
          sed -i "s|image: harbor.kigawa.net/private/lipl-api:.*|image: harbor.kigawa.net/private/lipl-api:main-${{ github.sha }}|" lipl/stg/lipl-api.yaml
          sed -i "s|image: harbor.kigawa.net/private/lipl-frontend:.*|image: harbor.kigawa.net/private/lipl-frontend:main-${{ github.sha }}|" lipl/stg/lipl-frontend.yaml

      - name: Commit and push
        working-directory: platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lipl/stg/lipl-api.yaml lipl/stg/lipl-frontend.yaml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "deploy: lipl stg ${{ github.sha }}"
          git push
