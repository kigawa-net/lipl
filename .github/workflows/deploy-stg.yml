name: Deploy (stg)

on:
  push:
    branches: [main]

concurrency:
  group: lipl-deploy-stg
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --console=plain
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: lipl-frontend
          - context: backend
            image: lipl-api
    steps:
      - uses: actions/checkout@v7

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            929d361e-e599-4b58-b173-b3e201004d0a > HARBOR_USERNAME
            13c66d3b-7eb6-4c37-b466-b3e2010057b1 > HARBOR_PASSWORD

      - uses: docker/login-action@v4
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: harbor.kigawa.net/private/${{ matrix.image }}:main-${{ github.sha }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            320f3982-890e-4865-8c15-b4b0005154aa > GH_APP_ID
            97b6eba7-6bd2-418d-9d64-b48a007a097a > GH_APP_PRIVATE_KEY

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: kigawa-net
          repositories: platform

      - name: Checkout platform repo
        uses: actions/checkout@v7
        with:
          repository: kigawa-net/platform
          token: ${{ steps.app-token.outputs.token }}
          path: platform

      - name: Update image tags for stg
        working-directory: platform
        run: |
          sed -i "s|image: harbor.kigawa.net/private/lipl-api:.*|image: harbor.kigawa.net/private/lipl-api:main-${{ github.sha }}|" lipl/stg/lipl-api.yaml
          sed -i "s|image: harbor.kigawa.net/private/lipl-frontend:.*|image: harbor.kigawa.net/private/lipl-frontend:main-${{ github.sha }}|" lipl/stg/lipl-frontend.yaml

      - name: Commit and push
        working-directory: platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lipl/stg/lipl-api.yaml lipl/stg/lipl-frontend.yaml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "deploy: lipl stg ${{ github.sha }}"
          git push
